services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: gridmind
      POSTGRES_DB: gridmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridmind -d gridmind"]
      interval: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI and OTLP over HTTP
      - "4317:4317"   # OTLP over gRPC

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gridmind:gridmind@db:5432/gridmind
      OTEL_ENDPOINT: http://phoenix:6006/v1/traces
      MODEL_CACHE_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - models:/models
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started

volumes:
  pgdata:
  models: